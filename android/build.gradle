buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["SinchPush_" + name]
  }

  ext.getExtOrIntegerDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["SinchPush_" + name]).toInteger()
  }

  ext.kotlinVersion = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "1.9.22"
  ext.androidGradlePluginVersion = rootProject.ext.has("androidGradlePluginVersion") ? rootProject.ext.get("androidGradlePluginVersion") : "8.3.0"

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:${androidGradlePluginVersion}"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
  }
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["SinchPush_" + name]).toInteger()
}

// FCM integration mode. Hosts override via rootProject.ext.SinchPush_firebaseMessaging
// ("optional" | "required" | "none"). The library falls back to gradle.properties.
def firebaseMessagingMode = getExtOrDefault("firebaseMessaging")
def firebaseMessagingAvailable = firebaseMessagingMode != "none"
def firebaseMessagingVersion = getExtOrDefault("firebaseMessagingVersion")

android {
  namespace "com.sinchpush"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    buildConfigField "boolean", "FCM_AVAILABLE", firebaseMessagingAvailable.toString()
    // Manifest placeholder gating the SinchPushFirebaseMessagingService.
    // "true"  -> service is registered and active (optional/required modes).
    // "false" -> service disabled (none mode, or host has its own service).
    manifestPlaceholders.SinchPush_fcmServiceEnabled = firebaseMessagingAvailable.toString()
    // Ship proguard rules to consumers. Required in AGP 8.6+ which removed
    // the top-level android.consumerProguardFiles DSL — must live on
    // defaultConfig (BaseFlavor).
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch"]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
      // src/fcm holds all code that directly references Firebase Messaging.
      // Excluded in "none" mode so the module compiles without firebase-messaging.
      if (firebaseMessagingAvailable) {
        java.srcDirs += ["src/fcm"]
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-native:+"

  if (firebaseMessagingMode == "required") {
    // Host wants the library to bring in firebase-messaging. The host still must
    // supply google-services.json and apply the Google Services plugin.
    implementation "com.google.firebase:firebase-messaging:${firebaseMessagingVersion}"
  } else if (firebaseMessagingMode == "optional" || firebaseMessagingMode == null) {
    // compileOnly: the FCM classes are available at library-compile time so the
    // SinchPushFirebaseMessagingService + reflection-based FcmProvider compile,
    // but firebase-messaging is NOT bundled. It activates at runtime only when
    // the host app already includes firebase-messaging.
    compileOnly "com.google.firebase:firebase-messaging:${firebaseMessagingVersion}"
  }
  // "none" -> no Firebase dependency; service source-set is excluded above.

  // --- Sinch native SDK ---------------------------------------------------
  // Uncomment and pin the version you integrate against.
  // implementation "com.sinch.android.sdk:sinch-android-rtc:+"
}
