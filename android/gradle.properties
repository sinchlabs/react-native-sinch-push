# Default build config for the library. These are overridden by the host app's
# root project ext values when present (see getExtOrIntegerDefault in build.gradle).
SinchPush_compileSdkVersion=34
SinchPush_minSdkVersion=21
SinchPush_targetSdkVersion=34

# FCM integration mode (overridden by host rootProject.ext.SinchPush_firebaseMessaging):
#   optional (default) - compileOnly firebase-messaging; auto-activates when host already
#                        includes FCM (no FCM service in app -> runtime no-op via reflection).
#   required           - implementation firebase-messaging (host still needs google-services.json
#                        and the Google Services plugin).
#   none               - no Firebase dependency and no manifest service; callers must obtain
#                        a token themselves and pass it via SinchPush.setDeviceToken().
SinchPush_firebaseMessaging=optional
SinchPush_firebaseMessagingVersion=24.1.0
