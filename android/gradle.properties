# Library option defaults are NOT set here: this module's gradle.properties is
# loaded as project properties and would shadow the host's own. They live in
# `ext.sinchPushDefaults` in build.gradle, and a host sets any of them prefixed
# (`SinchPush_firebaseMessaging=none`) in its android/gradle.properties or with -P,
# and prefixed or unprefixed in rootProject.ext:
#   compileSdkVersion, minSdkVersion, targetSdkVersion,
#   firebaseMessaging (optional | required | none), firebaseMessagingVersion,
#   relay (true | false), defaultNotificationChannel (true | false),
#   okhttpVersion, androidxCoreVersion, wireVersion
# The Wire runtime must stay equal to wireVersion in scripts/wire/gradle.properties.

# Standalone build only (RN-034). Host apps supply their own; these exist so
# `./gradlew assembleDebug testDebugUnitTest` works from android/ without one.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
# newArchEnabled is deliberately NOT set here: Gradle loads a subproject's own
# gradle.properties as project properties, so setting it would override the host
# app's value for this module (no codegen, oldarch sources). build.gradle treats
# an absent property as the old architecture for the standalone build.
