syntax = "proto3";

package sinch.conversationapi.callback.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "sinch/conversationapi/type/message_delivery_report.proto";
import "sinch/conversationapi/type/event_delivery_report.proto";
import "sinch/conversationapi/type/conversation_message.proto";
import "sinch/conversationapi/type/conversation_event.proto";
import "sinch/conversationapi/type/unsupported_callback.proto";
import "sinch/conversationapi/type/contact_create_notification.proto";
import "sinch/conversationapi/type/contact_delete_notification.proto";
import "sinch/conversationapi/type/contact_update_notification.proto";
import "sinch/conversationapi/type/conversation_start_notification.proto";
import "sinch/conversationapi/type/conversation_stop_notification.proto";
import "sinch/conversationapi/type/conversation_delete_notification.proto";
import "sinch/conversationapi/type/contact_merge_notification.proto";
import "sinch/conversationapi/type/opt_in_notification.proto";
import "sinch/conversationapi/type/opt_out_notification.proto";
import "sinch/conversationapi/type/capability_notification.proto";
import "sinch/conversationapi/type/channel_event_notification.proto";
import "sinch/conversationapi/type/smart_conversation_notification.proto";
import "sinch/conversationapi/type/record_notification.proto";
import "sinch/conversationapi/type/message_submit_notification.proto";
import "sinch/conversationapi/type/duplicated_contact_channel_identities_notification.proto";
import "sinch/conversationapi/type/channel_metadata.proto";

option csharp_namespace = "Sinch.ConversationApi.Callback.V1Beta";
option php_namespace = "Sinch\\ConversationApi\\Callback\\V1beta";
option java_package = "com.sinch.conversationapi.callback.v1";
option java_multiple_files = true;
option java_outer_classname = "CallbackServiceProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/callback/v1;callback";

// The Callback API
service Callback {
  // Sends a callback to a registered webhook
  rpc SendCallback(SendCallbackRequest) returns (google.protobuf.Empty) {
    option(google.api.http) = {
      post: "/callback"
      body: "*"
    };
  }
}

message SendCallbackRequest {
  // Optional. The ID of the app if the callback is associated with an app.
  string app_id = 1;

  // Required. The timestamp when the callback was accepted by the Conversation API.
  google.protobuf.Timestamp accepted_time = 2;

  // Required. Timestamp for when the event occurred, generated by the underlying channel associated with the callback.
  google.protobuf.Timestamp event_time = 3;

  // Required. The Project ID.
  string project_id = 4;

  oneof callback {
    sinch.conversationapi.type.MessageDeliveryReport message_delivery_report = 5;
    sinch.conversationapi.type.EventDeliveryReport event_delivery_report = 6;
    sinch.conversationapi.type.ConversationMessage message = 7;
    sinch.conversationapi.type.ConversationEvent event = 8;
    sinch.conversationapi.type.UnsupportedCallback unsupported_callback = 9;
    sinch.conversationapi.type.ContactCreateNotification contact_create_notification = 10;
    sinch.conversationapi.type.ContactDeleteNotification contact_delete_notification = 11;
    sinch.conversationapi.type.ConversationStartNotification conversation_start_notification = 12;
    sinch.conversationapi.type.ConversationStopNotification conversation_stop_notification = 13;
    sinch.conversationapi.type.ContactMergeNotification contact_merge_notification = 14;
    sinch.conversationapi.type.OptInNotification opt_in_notification = 15;
    sinch.conversationapi.type.OptOutNotification opt_out_notification = 16;
    sinch.conversationapi.type.CapabilityNotification capability_notification = 17;
    sinch.conversationapi.type.ConversationDeleteNotification conversation_delete_notification = 18;
    sinch.conversationapi.type.ContactUpdateNotification contact_update_notification = 21;
    sinch.conversationapi.type.ChannelEventNotification channel_event_notification = 22;
    sinch.conversationapi.type.SmartConversationNotification smart_conversation_notification = 23;
    sinch.conversationapi.type.RecordNotification record_notification = 24;
    sinch.conversationapi.type.MessageSubmitNotification message_submit_notification = 25;
    sinch.conversationapi.type.DuplicatedContactChannelIdentitiesNotification duplicated_contact_identities_notification = 26;
    sinch.conversationapi.type.ConversationMessage message_redaction = 28;

  }

  // Optional. message_metadata will be used to propagate MO metadata to callbacks.
  // This corresponds to the conversation_metadata field in SendMessageRequest
  string message_metadata = 19;

  //Removed MlIntentSentimentNotification
  reserved 20;

  // Optional. Arbitrary correlation ID related to the MT message.
  string correlation_id = 27;

  // Optional. Additional metadata provided by channel
  sinch.conversationapi.type.ChannelMetadata channel_metadata = 29;
}
