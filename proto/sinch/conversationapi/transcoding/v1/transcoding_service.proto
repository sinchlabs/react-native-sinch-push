syntax = "proto3";

package sinch.conversationapi.transcoding.v1;

import "sinch/conversationapi/type/conversation_message.proto";
import "sinch/conversationapi/type/conversation_channel.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Sinch.ConversationApi.Transcoding.V1Beta";
option php_namespace = "Sinch\\ConversationApi\\Transcoding\\V1beta";
option java_package = "com.sinch.conversationapi.transcoding.v1";
option java_multiple_files = true;
option java_outer_classname = "TranscodingServiceProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/transcoding/v1;transcoding";

// The Transcoding API
service Transcoding {
  /* Transcode a message
   *
   * Transcodes the message from the Conversation API format to the
   * channel-specific formats for the requested channels. No message
   * is sent to the contact. */
  rpc TranscodeMessage(TranscodeMessageRequest) returns (TranscodeMessageResponse) {
    option(google.api.http) = {
      post: "/v1/projects/{project_id}/messages:transcode"
      body: "*"
    };
  }
}

message TranscodeMessageRequest {
  // Required. The project ID.
  string project_id = 1;

  // Required. The ID of the app used to transcode the message.
  string app_id = 2;

  // Required. The message that should be transcoded.
  sinch.conversationapi.type.AppMessage app_message = 3;

  // Optional.
  string from = 4;

  // Optional.
  string to = 5;

  // Required. The list of channels for which the message shall be transcoded to.
  repeated sinch.conversationapi.type.ConversationChannel channels = 6;
}

message TranscodeMessageResponse {
  /* Output only. The transcoded message for the different channels.
   * The keys in the map correspond to channel names, as defined by the type
   * ConversationChannel. */
  map<string, string> transcoded_message = 1;
}
