syntax = "proto3";

package sinch.conversationapi.type;

option csharp_namespace = "Sinch.ConversationApi.Type";
option php_namespace = "Sinch\\ConversationApi\\Type";
option java_package = "com.sinch.conversationapi.type";
option java_multiple_files = true;
option java_outer_classname = "StatusProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/type";

/* Message/Event Status
 *
 * Note that not all statuses
 * are sent by the different channels. */
enum Status {
    STATUS_UNSPECIFIED = 0;
    QUEUED = 1;
    QUEUED_ON_CHANNEL = 2;
    DELIVERED = 3;
    READ = 4;
    FAILED = 5;
    SWITCHING_CHANNEL = 6;
    RECEIVED = 7; // For MO messages to set the status of messages received by conv-api
}
