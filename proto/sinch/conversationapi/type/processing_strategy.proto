syntax = "proto3";

package sinch.conversationapi.type;

option csharp_namespace = "Sinch.ConversationApi.Type";
option php_namespace = "Sinch\\ConversationApi\\Type";
option java_package = "com.sinch.conversationapi.type";
option java_multiple_files = true;
option java_outer_classname = "ProcessingStrategyProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/type";


enum ProcessingStrategy {
  /* Default processing strategy. The user-defined processing mode of the app will be applied. */
  DEFAULT = 0;
  /* Forces the request to be processed in dispatch mode (without creating contacts or conversations)
   * regardless of the processing mode in which the app is currently running. */
  DISPATCH_ONLY = 1;
}
