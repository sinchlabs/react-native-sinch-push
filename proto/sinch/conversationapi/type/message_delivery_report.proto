syntax = "proto3";

package sinch.conversationapi.type;

import "sinch/conversationapi/type/status.proto";
import "sinch/conversationapi/type/reason.proto";
import "sinch/conversationapi/type/contact.proto";
import "sinch/conversationapi/type/processing_mode.proto";

option csharp_namespace = "Sinch.ConversationApi.Type";
option php_namespace = "Sinch\\ConversationApi\\Type";
option java_package = "com.sinch.conversationapi.type";
option java_multiple_files = true;
option java_outer_classname = "MessageDeliveryReportProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/type";

/* Message Delivery Report
 *
 * A delivery receipt for message sent from an app. */
message MessageDeliveryReport {
  // Required. The ID of the message.
  string message_id = 1;

  // Optional. The conversation ID this message belongs to. Will not be present for messages sent in Dispatch Mode.
  string conversation_id = 3;

  // Required. The delivery status.
  sinch.conversationapi.type.Status status = 4;

  // Required. The channel and contact channel identity of the message.
  sinch.conversationapi.type.ChannelIdentity channel_identity = 5;

  // Optional. The ID of the contact. Will not be present for messages sent in Dispatch Mode.
  string contact_id = 6;

  // Optional. A reason will be present if the status is FAILED or SWITCHING_CHANNEL.
  sinch.conversationapi.type.Reason reason = 7;

  // Optional. Metadata specified when sending the message.
  // Up to 1024 characters long.
  // This corresponds to the message_metadata field in SendMessageRequest.
  string metadata = 8;

  // Required. The processing mode of the original message.
  sinch.conversationapi.type.ProcessingMode processing_mode = 9;
}
