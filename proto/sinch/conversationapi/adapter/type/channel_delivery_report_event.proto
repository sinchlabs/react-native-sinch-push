syntax = "proto3";

package sinch.conversationapi.adapter.type;


import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "sinch/conversationapi/type/conversation_channel.proto";
import "sinch/conversationapi/type/status.proto";
import "sinch/conversationapi/type/reason.proto";
import "sinch/conversationapi/type/channel_session.proto";


option csharp_namespace = "Sinch.Conversationapi.Adapter.Type";
option php_namespace = "Sinch\\Conversationapi\\Adapter\\Type";
option java_package = "com.sinch.conversationapi.adapter.type";
option java_multiple_files = true;
option java_outer_classname = "ChannelDeliveryReportEventProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/adapter/type;v1beta";


message ChannelDeliveryReportEvent {

  // Require. App id .
  string app_id = 1;

  // Required. The originating channel.
  sinch.conversationapi.type.ConversationChannel channel = 2;

  // Required. The message_id generated by the channel.
  // Value could be empty only when event contains FAILED status and messages wasn't QUEUED_ON_CHANNEL.
  string channel_message_id = 3;

  // Required for QUEUED_ON_CHANNEL and FAILED statuses when no QUEUED_ON_CHANNEL event was sent.
  // Optional for other cases but should be present if value is available during event creation
  string sinch_message_id = 4;

  // Optional. Originator (Contact) channel identity.
  string from = 5;

  // Required. The timestamp from the channel callback.
  google.protobuf.Timestamp timestamp = 6;

  //Required
  MessageDeliveryStatus message_delivery_status = 7;

}

message MessageDeliveryStatus {

  // Required. A status will always be present.
  sinch.conversationapi.type.Status status = 1;

  // Optional. A reason shall be present if the status is FAILED.
  sinch.conversationapi.type.Reason reason = 2;

  // Optional. For channels which has support for sessions (session based pricing)
  sinch.conversationapi.type.ChannelSession channel_session = 3;

  // Optional. Metadata about the MT message that can be added to CDRs.
  map<string, string> cdr_metadata = 4;

  //Optional. Metadata will be propagated along with customer DR callback.
  string customer_callback_metadata = 5;

}
