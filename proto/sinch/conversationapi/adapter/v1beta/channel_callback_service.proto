syntax = "proto3";

package sinch.conversationapi.adapter.v1beta;


import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "sinch/conversationapi/type/conversation_message.proto";
import "sinch/conversationapi/type/conversation_event.proto";
import "sinch/conversationapi/type/conversation_channel.proto";
import "sinch/conversationapi/type/channel_metadata.proto";
import "sinch/conversationapi/adapter/type/channel_delivery_report.proto";
import "sinch/conversationapi/adapter/type/channel_reason.proto";


option csharp_namespace = "Sinch.Conversationapi.Adapter.V1Beta";
option php_namespace = "Sinch\\Conversationapi\\Adapter\\V1beta";
option java_package = "com.sinch.conversationapi.adapter.v1beta";
option java_multiple_files = true;
option java_outer_classname = "ChannelCallbackProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/adapter/v1beta";

// Sends a channel callback to a conversation app.
service ChannelCallback {
  rpc SendChannelCallback (SendChannelCallbackRequest) returns (SendChannelCallbackResponse);
}

message SendChannelCallbackRequest {
  // Required. Messages/events/delivery receipts contained in the request.
  repeated ChannelCallbackRequest channel_callbacks = 1;

  // Required. The Conversation API app ID of the receiving app.
  string app_id = 2;

  // Required. The originating channel.
  sinch.conversationapi.type.ConversationChannel channel = 4;
}

message ChannelCallbackRequest {
  // Required. Originator (Contact) channel identity. Can be left out for unsupported callback.
  string from = 1;

  // Optional. Recipient channel identity.
  string to = 2;

  /* Required. The message_id generated by the channel.
   * For MO Messages and Delivery Reports this is required but can be left out
   * for events and unsupported callbacks */
  string channel_message_id = 3;

  // Required. The timestamp from the channel callback.
  google.protobuf.Timestamp timestamp = 4;

  // Required. The message.
  oneof message {
    sinch.conversationapi.type.ContactMessage contact_message = 5;
    sinch.conversationapi.type.ContactEvent contact_event = 6;
    sinch.conversationapi.type.ContactMessageEvent contact_message_event = 15;
    sinch.conversationapi.adapter.type.ChannelDeliveryReport delivery_report = 7;
    string unsupported_callback = 8;
    google.protobuf.Empty opt_in = 9;
    google.protobuf.Empty opt_out = 10;
  }

  /* Required for ChannelDeliveryReport QUEUED_ON_CHANNEL status when channel works in async mode.
   * Optional. Used if the adapter wants to control the message id to user
   * for the generated callback. Must be a valid ULID.*/
  string sinch_message_id = 11;

  // Optional. Additional properties.
  AdditionalProperties additional_properties = 12;

   // Optional. The metadata_message will be used to propagate Mo metadata to callbacks.
  string metadata_message = 13;

  /* Optional.
   * Provides the ability to change default channel callback processing strategy. */
  ProcessingStrategy processing_strategy = 14;

  // Optional. Additional metadata provided by channel
  sinch.conversationapi.type.ChannelMetadata channel_metadata = 16;

  // Optional. Metadata about the message that can be added to CDRs.
  map<string, string> cdr_metadata = 17;
}

message SendChannelCallbackResponse {
  // Required. The Conversation API app ID of the receiving app.
  string app_id = 1;

  // If the request was erroneous then the error is presented here.
  sinch.conversationapi.adapter.type.ChannelReason error = 2;

  repeated ChannelCallbackResponse responses = 3;
}

message ChannelCallbackResponse {
  // Optional. The channel message ID for MO Messages and Delivery Reports.
  string channel_message_id = 1;

  // Optional. Conv API message ID if the callback is successfully queued.
  string sinch_message_id = 2;

  // Error in case the message/event/dr in the request was erroneous.
  sinch.conversationapi.adapter.type.ChannelReason error = 3;
}

message AdditionalProperties{

  /* Optional. Contains channel specific contact name. */
  string contact_name = 1;
}

enum ProcessingStrategy {
  /* Default processing strategy. Any user-defined settings for the app will be applied.
   * In case any of the options is not set specifically by the user, the default value for that option will be used.*/
  DEFAULT = 0;

  /* Forces this channel callback to be process in dispatch mode, regardless of the processing mode in which the app is currently running. */
  DISPATCH_ONLY = 1;
}
