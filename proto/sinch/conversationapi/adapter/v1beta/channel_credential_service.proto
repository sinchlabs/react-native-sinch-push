syntax = "proto3";

package sinch.conversationapi.adapter.v1beta;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "sinch/conversationapi/type/conversation_channel.proto";
import "sinch/conversationapi/type/authentication.proto";
import "sinch/conversationapi/adapter/type/channel_reason.proto";

option csharp_namespace = "Sinch.Conversationapi.Adapter.V1Beta";
option php_namespace = "Sinch\\Conversationapi\\Adapter\\V1beta";
option java_package = "com.sinch.conversationapi.adapter.v1beta";
option java_multiple_files = true;
option java_outer_classname = "ChannelCredentialProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/adapter/v1beta";

// Allows management of channel credential via adapters.
service ChannelCredential {

    // Get specific channel credential by appId or channelKnownId.
    rpc GetChannelCredential (GetChannelCredentialRequest) returns (GetChannelCredentialResponse);

    // Set specific channel credential. Performs an upsert operation
    rpc SetChannelCredential (SetChannelCredentialRequest) returns (SetChannelCredentialResponse);

    // Get channel credential list by appId or channelKnownId
    rpc GetChannelCredentialList (GetChannelCredentialListRequest) returns (GetChannelCredentialListResponse);
}

message GetChannelCredentialRequest {
    // Required. The channel for which the credentials are to be obtained.
    sinch.conversationapi.type.ConversationChannel channel = 1;

    // Optional. Must be a valid ULID
    string credential_id = 4;

    // Required. The identifier after which the credential is to be obtained.
    oneof message {
        string app_id = 2;
        // Additional identifier set by the channel when appId is unknown at the time of MO processing.
        string channel_known_id = 3;
    }
}

message GetChannelCredentialResponse {
    // Required. AppId in which the channel credentials are used.
    string app_id = 1;

    /* Optional. Additional identifier set by the channel that will allow you
     * to read the appropriate credentials at the moment when the appId is unknown. */
    string channel_known_id = 2 [deprecated = true];
    
    // Required. Obtained channel credential.
    sinch.conversationapi.type.ConversationChannelCredential channel_credentials = 3;

    // If the request was erroneous then the error is presented here.
    sinch.conversationapi.adapter.type.ChannelReason error = 4;

    // Optional. Unique Id of a credential
    string credential_id = 5;
}

message SetChannelCredentialRequest {
    // Required. AppId for which the credential will be set.
    string app_id = 1;

    /* Optional. Additional identifier set by the channel that will allow you
     * to read the appropriate credentials at the moment when the appId is unknown. */
    string channel_known_id = 2 [deprecated = true];

    // Required. The credentials to be saved
    sinch.conversationapi.type.ConversationChannelCredential channel_credentials = 3;
}

message SetChannelCredentialResponse {
    // If the request was erroneous then the error is presented here.
    sinch.conversationapi.adapter.type.ChannelReason error = 1;
}

message GetChannelCredentialListRequest {
    // Required. The channel for which the credentials are to be obtained.
    sinch.conversationapi.type.ConversationChannel channel = 1;

    // Required. The identifier after which the credential is to be obtained.
    oneof message {
        string app_id = 2;
        // Additional identifier set by the channel when appId is unknown at the time of MO processing.
        string channel_known_id = 3;
    }
}

message GetChannelCredentialListResponse {

    // Required. AppId in which the channel credentials are used.
    string app_id = 1;

    repeated ChannelCredentialEntry channel_credential_entry_list = 2;

    // If the request was erroneous then the error is presented here.
    sinch.conversationapi.adapter.type.ChannelReason error = 3;

}

message ChannelCredentialEntry{
    // Required. Obtained channel credential.
    sinch.conversationapi.type.ConversationChannelCredential channel_credential = 1;

    // Optional. Set for channels with multiple credentials support.
    string credential_id = 2;
}