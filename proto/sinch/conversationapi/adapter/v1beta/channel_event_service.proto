syntax = "proto3";

package sinch.conversationapi.adapter.v1beta;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "sinch/conversationapi/adapter/type/channel_reason.proto";

option csharp_namespace = "Sinch.Conversationapi.Adapter.V1Beta";
option php_namespace = "Sinch\\Conversationapi\\Adapter\\V1beta";
option java_package = "com.sinch.conversationapi.adapter.v1beta";
option java_multiple_files = true;
option java_outer_classname = "ChannelEventServiceProto";
option go_package = "git.clxnetworks.net/dev/conv-api/grpc-gateway/generated/sinch/conversationapi/adapter/v1beta";

// Sends a channel event callback to a conversation app.
service ChannelEvent {
  rpc SendChannelEventCallback (SendChannelEventCallbackRequest) returns (SendChannelEventCallbackResponse);
}

message SendChannelEventCallbackRequest {

  // Required. The ID of the app the channel event is associated with.
  string app_id = 1;

  // Required. Timestamp for when the channel event occurred, generated by the underlying channel associated with the channel event.
  google.protobuf.Timestamp event_time = 2;

  // Required. The direct event originated from the channel
  google.protobuf.Struct channel_event = 3;
}

message SendChannelEventCallbackResponse {
  // Required. The Conversation API app ID of the receiving app.
  string app_id = 1;
  // If the request was erroneous then the error is presented here.
  sinch.conversationapi.adapter.type.ChannelReason error = 2;
}

